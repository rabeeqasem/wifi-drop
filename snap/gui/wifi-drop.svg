<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38b6ff"/>
      <stop offset="0.55" stop-color="#2f6bff"/>
      <stop offset="1" stop-color="#6a3dff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arrow" gradientUnits="userSpaceOnUse" x1="128" y1="140" x2="128" y2="198">
      <stop offset="0" stop-color="#2f8bff"/>
      <stop offset="1" stop-color="#5b45ff"/>
    </linearGradient>
  </defs>

  <!-- background tile -->
  <rect x="12" y="12" width="232" height="232" rx="58" fill="url(#bg)"/>
  <rect x="12" y="12" width="232" height="116" rx="58" fill="url(#shine)"/>

  <!-- wi-fi waves -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="15">
    <path d="M71 74 A81 81 0 0 1 185 74" opacity="0.6"/>
    <path d="M95 98 A47 47 0 0 1 161 98" opacity="0.9"/>
  </g>

  <!-- phone -->
  <!-- soft shadow (plain shapes, no filters, so every renderer draws it) -->
  <rect x="86" y="114" width="84" height="120" rx="22" fill="#1a1060" opacity="0.12"/>
  <rect x="88" y="116" width="80" height="116" rx="20" fill="#1a1060" opacity="0.14"/>
  <rect x="90" y="112" width="76" height="114" rx="18" fill="#fff"/>
  <rect x="116" y="121" width="24" height="6" rx="3" fill="#d5dcf5"/>

  <!-- download arrow on the phone screen -->
  <g fill="none" stroke="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" stroke-width="13">
    <path d="M128 143 V194"/>
    <path d="M109 176 L128 195 L147 176"/>
  </g>
  <rect x="108" y="207" width="40" height="7" rx="3.5" fill="#d5dcf5"/>
</svg>
